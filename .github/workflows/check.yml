name: Installer checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: /usr/bin/python3 --version
      - run: /usr/bin/python3 -m unittest discover -s tests -v
      - run: /usr/bin/python3 -m py_compile install.py tools/prepare_release.py tools/promote_beta.py
